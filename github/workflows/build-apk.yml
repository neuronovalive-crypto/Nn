name: Build APK v4

on:
  push:
    branches:
      - main
      - build-apk-v4
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        continue-on-error: true

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease
          else
            echo "No gradlew found - please ensure this is an Android project with gradle setup"
          fi
        continue-on-error: true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-v4
          path: app/build/outputs/apk/
        continue-on-error: true

      - name: Create Release
        uses: actions/create-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: APK Version 4 - ${{ github.ref }}
          draft: false
          prerelease: false
        continue-on-error: true
